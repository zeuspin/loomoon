services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loomoon
      POSTGRES_USER: loomoon
      POSTGRES_PASSWORD: loomoon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/000-schema.sql:ro
      - ./packages/database/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/001-initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomoon -d loomoon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-loomoon}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-loomoon}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-loomoon-assets}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
